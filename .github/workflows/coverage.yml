name: Coverage

# Once a week, measures how much of thechatplace the tests run on Windows,
# macOS and Linux, combines the three, and compares the result with
# testing/coverage/baseline.json (tools/coverage_check.py has the rules). If a
# file's coverage dropped, it files an issue labelled coverage-regression, or
# comments on the one already open, rather than a new issue every week (#628).
# A run can also be started by hand (Actions, Coverage, Run workflow).
# Its coverage.json is what a new baseline is accepted from (DEVELOPING.md,
# "Test coverage").

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      COVERAGE_FILE: .coverage.${{ matrix.name }}
    steps:
      # Pinned to release commits, as in thechatplace-tests.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Test
        if: runner.os != 'Linux'
        run: |
          python -m pip install -r requirements-dev.txt pytest-cov==7.1.0 coverage==7.17.2
          python -m pytest -q tests --cov
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-venv python3-wxgtk4.0 python3-wxgtk-webview4.0 xvfb xauth at-spi2-core
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements-dev.txt pytest-cov==7.1.0 coverage==7.17.2
          xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python -m pytest -q tests --cov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-data-${{ matrix.name }}
          path: .coverage.${{ matrix.name }}
          include-hidden-files: true
          retention-days: 7

  # Only after all three measured: a platform whose tests failed would look
  # like a drop everywhere. A failed test fails the run, which GitHub reports.
  compare:
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine
        run: |
          python -m pip install coverage==7.17.2
          python -m coverage combine
          python -m coverage json -q -o coverage.json
          python -m coverage html -q -d coverage-html
      - name: Compare with the baseline
        id: check
        run: |
          set +e
          python tools/coverage_check.py coverage.json --report coverage-report.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          code=$?
          # 3 is a drop (coverage_check.EXIT_DROPPED); anything else but 0 is
          # the check itself failing.
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
          echo "dropped=$([ "$code" -eq 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
      # Kept even when the check fails, to see why.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage-report.md
            coverage-html
          if-no-files-found: ignore
      - name: File or update the coverage issue
        if: steps.check.outputs.dropped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label coverage-regression --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file coverage-report.md
          else
            gh issue create --label coverage-regression \
              --title "Test coverage dropped ($(date -u +%Y-%m-%d))" --body-file coverage-report.md
          fi
