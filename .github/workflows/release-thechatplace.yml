name: Release The Chat Place

# A tag like v0.1.0 tests and builds The Chat Place for Windows and macOS side by side, and
# publishes one GitHub release with both, as Image Description Toolkit's release.yml does, and only
# if both builds succeed: a release without one of them is worse than none.
#
#   windows  PyInstaller, signed with Azure Artifact Signing; the Velopack installer, portable
#            zip and update feed; every signature checked.
#   macos    BuildAndRelease/MacBuilds/build_macos.sh: the app, signed with the Developer ID
#            certificate, packed by Velopack (so it updates itself, as GHManage's does) and
#            notarized; the osx update feed; TheChatPlace-macos-arm64.dmg, notarized. Secrets:
#            MACOS_* and NOTARY_*, set from The-Idea-Place-Projects/signing (sync-secrets.py).
#   publish  the release (tags only).
#
#   (bump __version__ in thechatplace/__init__.py and add
#    release-notes/v<version>.md in the same commit)
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Run by hand (Actions, Run workflow) or for a pull request, it tests, builds and packs the same
# way and publishes nothing; the files are kept as a workflow artifact. A hand run with "sign"
# ticked, or a pull request labelled sign-build, also signs (and on the Mac notarizes) and checks
# the signatures, which proves signing works without a release.
#
# Velopack and signing follow GHManage's ghmanage.yml and The-Idea-Place-Projects/signing
# (lessons.md): sign the program first, then `vpk pack --azureTrustedSignFile` signs Setup, the
# updater and the launcher stub, and skips the program it finds already signed. On the Mac,
# sign inside-out first, then `vpk pack --signDisableDeep` signs only its UpdateMac and the bundle.
# The Chat Place publishes on two Velopack channels, "windows" and "osx" (releases.<channel>.json),
# the ones updater.CHANNEL reads on each platform.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    # "labeled" so adding the sign-build label to a pull request re-runs it signed.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and check the signatures too (nothing is published either way)'
        type: boolean
        default: false

permissions:
  contents: write   # create the release (tag runs only)
  id-token: write   # the OIDC token azure/login exchanges for Azure credentials

concurrency:
  group: release-thechatplace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    # Matches the OIDC subject the Azure federated credential trusts. It is not a gate: the
    # environment is unprotected.
    environment: azure-signing
    defaults:
      run:
        shell: pwsh
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Signs for a tag; for a hand run with "sign" ticked; and for a pull request labelled
      # sign-build, which proves signing before a workflow change reaches main (a hand run can
      # only start a workflow that is already on main). Nothing but a tag publishes.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'sign-build')) }}
      CHANNEL: windows
    steps:
      # Every action is pinned to a release commit, like thechatplace-tests.yml: checkout v4.4.0,
      # setup-python v5.6.0, azure/login v3.1.0, artifact-signing-action v2.0.0, upload-artifact v4.6.2.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      # Before anything is built or signed, so a failing test stops a release.
      - name: Test
        run: python -m pytest -v tests

      # One version, in thechatplace/__init__.py. A tag that disagrees fails here, before anything
      # is built: the updater compares installed and published versions, so they must match.
      - name: Version
        run: |
          if ($env:PUBLISH -eq 'true') {
            $version = python tools/check_version.py $env:GITHUB_REF_NAME
          } else {
            $version = python tools/check_version.py
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $notes = "release-notes/v$version.md"
          if (-not (Test-Path $notes)) { throw "Write $notes before releasing $version." }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "NOTES=$notes" | Out-File $env:GITHUB_ENV -Append
          Write-Host "The Chat Place $version"

      # --onedir, not --onefile: Velopack swaps an app folder in place, and a onefile exe would
      # unpack itself on every start. velopack is imported lazily, so it is named explicitly; the
      # speech scripts and NVDA's controller client (thechatplace/nvda, #98) are data files; the
      # Mac build leaves the client out. --collect-binaries wx brings wx's WebView2Loader.dll, which
      # PyInstaller otherwise leaves out, and without it full messages can't open as a formatted
      # page (#190; the smoke test checks for it).
      - name: Build
        run: |
          python tools/make_version_info.py
          python -m PyInstaller --noconfirm --clean --noconsole --onedir --name TheChatPlace `
            --version-file build/version_info.txt --hidden-import velopack --hidden-import thechatplace.providers.codex --collect-binaries wx `
            --icon thechatplace/assets/app.ico `
            --add-data "thechatplace/assets;thechatplace/assets" `
            --add-data "thechatplace/speech;thechatplace/speech" `
            --add-data "thechatplace/nvda;thechatplace/nvda" TheChatPlace.pyw
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The built app imports everything and checks its data files, without opening a window, so
      # a module PyInstaller missed fails the run here rather than on someone's PC.
      - name: Smoke test the built app
        run: |
          $p = Start-Process dist\TheChatPlace\TheChatPlace.exe -ArgumentList '--smoke-test', 'smoke.json' -Wait -PassThru
          Get-Content smoke.json
          if ($p.ExitCode -ne 0) { throw "The built app's smoke test failed (exit $($p.ExitCode))." }

      - name: Azure login (code signing)
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the app
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: kellylford
          certificate-profile-name: kellyford-public
          files-folder: ${{ github.workspace }}\dist\TheChatPlace
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # UTF-8 without a byte-order mark: vpk's --azureTrustedSignFile reader needs exactly that.
      - name: Write signing metadata
        if: env.SIGN == 'true'
        run: |
          $json = @{
            Endpoint               = 'https://eus.codesigning.azure.net/'
            CodeSigningAccountName = 'kellylford'
            CertificateProfileName = 'kellyford-public'
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\signing-metadata.json", $json)

      # The same version as the velopack package in requirements.txt: the packer and the
      # library in the app must agree on the feed and package formats.
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # The previous release's packages let vpk build a delta update, and its full package goes
      # up with this release so the feed's every file is in one release (the updater reads
      # just that one). Found by tag, not with `vpk download github`, which only looks at the
      # repo's 10 newest releases. None before the first release.
      - name: Download the previous release's packages
        if: env.PUBLISH == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prev = gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName,isDraft `
            --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("v"))] | .[0] // empty'
          if (-not $prev) { Write-Host 'No earlier The Chat Place release.'; exit 0 }
          Write-Host "Previous release: $prev"
          vpk download http --url "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$prev/" `
            --channel $env:CHANNEL --outputDir releases

      - name: Pack the installer, portable zip and update feed
        run: |
          $sign = @()
          if ($env:SIGN -eq 'true') { $sign = @('--azureTrustedSignFile', "$env:GITHUB_WORKSPACE\signing-metadata.json") }
          vpk pack --packId TheChatPlace --packVersion $env:VERSION `
            --packDir dist/TheChatPlace --mainExe TheChatPlace.exe `
            --packTitle "The Chat Place" --packAuthors "Kelly Ford" `
            --icon thechatplace/assets/app.ico `
            --channel $env:CHANNEL --outputDir releases `
            --instLocation PerUser --shortcuts StartMenuRoot `
            --releaseNotes $env:NOTES @sign
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem releases | Select-Object Name, Length

      # A tag can never publish anything unsigned. Checks every program a user runs: Setup, the
      # app in the portable zip, and the app, updater and launcher inside the full package.
      - name: Check every signature
        if: env.SIGN == 'true'
        run: |
          $check = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\sigcheck"
          $files = @(Get-ChildItem releases\*.exe)
          Expand-Archive "releases\TheChatPlace-$env:CHANNEL-Portable.zip" "$check\portable" -Force
          $files += Get-ChildItem "$check\portable" -Recurse -Filter *.exe
          foreach ($pkg in Get-ChildItem "releases\TheChatPlace-$env:VERSION-$env:CHANNEL-full.nupkg") {
            Copy-Item $pkg.FullName "$check\full.zip"
            Expand-Archive "$check\full.zip" "$check\full" -Force
            $files += Get-ChildItem "$check\full\lib\app" -Filter *.exe
          }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status), $($sig.SignerCertificate.Subject), timestamped: $([bool]$sig.TimeStamperCertificate)"
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($files.Count -lt 4) { throw "Expected at least 4 programs to check, found $($files.Count)." }
          if ($bad) { throw "$bad program(s) aren't validly signed." }

      - name: Keep the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thechatplace-windows-${{ env.VERSION }}-${{ env.SIGN == 'true' && 'signed' || 'unsigned' }}
          path: |
            releases/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS
    # Apple Silicon. build_macos.sh refuses anything else.
    # vpk below must match the velopack library in requirements.txt, as on Windows.
    runs-on: macos-latest
    timeout-minutes: 75   # two notarizations (the app through vpk, then the .dmg)
    defaults:
      run:
        shell: bash
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # The same rule as the Windows job: a tag always signs, and a tag never publishes an
      # unsigned app. Signing a Mac app also means notarizing it, or Gatekeeper still refuses it.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'sign-build')) }}
      HAVE_SECRETS: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Signing secrets
        if: env.SIGN == 'true' && env.HAVE_SECRETS != 'true'
        run: |
          echo "::error::Signing the Mac app needs the secrets MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, NOTARY_KEY_P8, NOTARY_KEY_ID and NOTARY_ISSUER_ID in this repository (the same values as Image Description Toolkit's)."
          exit 1

      # The release notes and the tag's version are checked by the Windows job; this one only
      # needs the version to agree with the tag, so the .dmg's app says the same number.
      - name: Version
        run: |
          if [ "$PUBLISH" = "true" ]; then python tools/check_version.py "$GITHUB_REF_NAME"; fi
          echo "VERSION=$(python tools/check_version.py)" >> "$GITHUB_ENV"

      # The certificate goes into a throwaway keychain in RUNNER_TEMP, never the login keychain,
      # and is deleted at the end whatever happens (as in Image Description Toolkit).
      - name: Import the Developer ID certificate
        if: env.SIGN == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # A default keychain locks after 5 minutes, partway through a build.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this codesign waits on a password prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # The runner's dotnet can install a tool but has no runtime for vpk (net10.0) to run on;
      # setup-dotnet adds it and sets DOTNET_ROOT (GHManage found this). setup-dotnet v6.0.0.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # As on Windows: the previous release's osx packages let vpk build a delta, and its full
      # package goes up with this release. None before the first release with a Mac build.
      - name: Download the previous release's packages
        if: env.PUBLISH == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("v"))] | .[0] // empty')
          if [ -z "$prev" ]; then echo "No earlier release."; exit 0; fi
          echo "Previous release: $prev"
          vpk download http --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$prev/" \
            --channel osx --outputDir releases

      # Tests, the app and its smoke tests, signing, Velopack, the .dmg and notarization: the same
      # script as a local build. TCP_PYTHON makes .venv from the Python set up above.
      - name: Build, sign and notarize
        env:
          TCP_PYTHON: python
          TCP_KEEP_RELEASES: '1'
          TCP_SIGN_CODE: ${{ env.SIGN == 'true' && '1' || '0' }}
          TCP_NOTARIZE: ${{ env.SIGN == 'true' && '1' || '0' }}
          TCP_SIGNING_IDENTITY: "${{ secrets.MACOS_SIGNING_IDENTITY || 'Developer ID Application: Kelly Ford (P887QF74N8)' }}"
          # codesign, notarytool's profile (which vpk notarizes with) and vpk all use it.
          TCP_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: BuildAndRelease/MacBuilds/build_macos.sh

      # What a person downloading it will see: Gatekeeper's verdict on the notarized .dmg, and
      # that it mounts and holds the app with Velopack's updater in it (an app without UpdateMac
      # runs perfectly and never updates again).
      - name: Check the disk image
        run: |
          set -euo pipefail
          DMG=releases/TheChatPlace-macos-arm64.dmg
          hdiutil verify "$DMG"
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly
          APP="$MNT/The Chat Place.app"
          test -x "$APP/Contents/MacOS/TheChatPlace"
          test -f "$APP/Contents/MacOS/UpdateMac"
          test -L "$MNT/Applications"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist"
          if [ "$SIGN" = "true" ]; then
            codesign --verify --strict --deep --verbose=2 "$APP"
            spctl --assess --type execute -v "$APP"
            spctl --assess --type open --context context:primary-signature -v "$DMG"
            xcrun stapler validate "$DMG"
          fi
          hdiutil detach "$MNT"

      - name: Keep the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thechatplace-macos-${{ env.VERSION }}-${{ env.SIGN == 'true' && 'signed' || 'unsigned' }}
          # The .pkg and portable zip vpk also makes aren't published: the .pkg would need a
          # Developer ID Installer certificate, and the .dmg holds the same self-updating app.
          path: |
            releases/TheChatPlace-macos-arm64.dmg
            releases/TheChatPlace-*-osx-*.nupkg
            releases/releases.osx.json
            releases/assets.osx.json
            releases/RELEASES-osx
          if-no-files-found: error
          retention-days: 14

      # Runs even when the build fails, so a signing key never outlives the job.
      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  publish:
    name: Publish the release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Both jobs' files, from this run (download-artifact v4.3.0).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: thechatplace-*-signed
          path: releases
          merge-multiple: true

      # Each platform's feed files (releases.<channel>.json, assets.<channel>.json,
      # RELEASES-<channel>) and full packages are what installed copies update from, so they go
      # up with the Windows installer and portable zip and the Mac disk image. Before 1.0 a
      # release is a pre-release; the updater includes pre-releases.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="release-notes/v$VERSION.md"
          ls -l releases
          shopt -s nullglob
          assets=()
          for channel in windows osx; do
            packages=(releases/TheChatPlace-*-$channel-*.nupkg)
            if [ ! -f "releases/TheChatPlace-$VERSION-$channel-full.nupkg" ]; then
              echo "::error::TheChatPlace-$VERSION-$channel-full.nupkg is missing."; exit 1
            fi
            assets+=("${packages[@]}")
            for name in "releases.$channel.json" "assets.$channel.json" "RELEASES-$channel"; do
              if [ ! -f "releases/$name" ]; then echo "::error::$name is missing."; exit 1; fi
              assets+=("releases/$name")
            done
          done
          for name in TheChatPlace-windows-Setup.exe TheChatPlace-windows-Portable.zip \
                      TheChatPlace-macos-arm64.dmg; do
            if [ ! -f "releases/$name" ]; then echo "::error::$name is missing."; exit 1; fi
            assets+=("releases/$name")
          done
          pre=()
          case "$VERSION" in 0.*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "The Chat Place $VERSION" \
            --notes-file "$NOTES" "${pre[@]}"
