name: Probe TCP remembered Codex approvals
on:
  pull_request:
    paths:
      - thechatplace/providers/codex_permissions.py
      - thechatplace/providers/codex_requests.py
      - thechatplace/providers/codex_tools.py
      - tools/probe_codex_workflows.py
      - thechatplace/platform_paths.py
      - tools/probe_codex_remembered_approvals.py
      - .github/workflows/probe-codex-remembered-approvals.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        codex: ['0.163.0', '0.166.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm install -g @openai/codex@${{ matrix.codex }}
      - name: Install the shared library used by tool approval forms
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          requirement = next(line for line in Path('requirements.txt').read_text().splitlines()
                             if line.startswith('theideaplace-appkit'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', requirement], check=True)
      - name: Exercise real Codex approvals and workflows with local synthetic services
        shell: bash
        run: |
          root="$(npm root -g)/@openai/codex"
          binary=$(find "$root" -type f \( -name codex -o -name codex.exe \) -path '*vendor*' | head -1)
          python tools/probe_codex_remembered_approvals.py --codex "$binary" --out "$RUNNER_TEMP/native-approvals.json"
          python tools/probe_codex_workflows.py --binary "$binary" --out "$RUNNER_TEMP/native-workflows.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-approvals-${{ runner.os }}-${{ matrix.codex }}
          path: |
            ${{ runner.temp }}/native-approvals.json
            ${{ runner.temp }}/native-workflows.json
