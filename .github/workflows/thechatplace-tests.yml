name: The Chat Place tests

# Runs The Chat Place's pytest suite on Windows, macOS and Linux (x64 and
# arm64), the platforms it ships for. Tests of one platform's behaviour (C:\
# paths and MSAA names on Windows, ATK names on Linux) skip on the others
# (tests/markers.py). The UI tests build the window hidden, which works on a
# runner without a desktop; Linux's still needs a display, so it gets Xvfb.
# Linux uses the distribution's wxPython (PyPI has no Linux wheels), as
# linuxsetup.sh does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thechatplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux x64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Pinned to release commits (v7.0.1, v7.1.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        if: runner.os != 'Linux'
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        if: runner.os != 'Linux'
        run: python -m pytest -v tests

      # Ubuntu's own Python and wxPython (4.2.1), with the rest from PyPI in a
      # venv that sees them.
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-venv python3-wxgtk4.0 python3-wxgtk-webview4.0 xvfb xauth at-spi2-core
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python -m pytest -v tests

  # What Orca says and reaches, with real Orca in a desktop of its own
  # (tools/linux_a11y_session.sh): no person, sound or VM needed (#230).
  # - tools/orca_speech.sh presses keys through the window, menus and
  #   dialogs and checks Orca's speech for each.
  # - The visual probe's Orca audit, checked by tools/orca_names.py, fails on
  #   any control Orca would reach without a name.
  # Not a required check, and not in the release workflow, so a problem here
  # never holds up a release; it shows on the pull request that caused it.
  orca:
    name: Orca (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-venv python3-wxgtk4.0 python3-wxgtk-webview4.0 xvfb xauth at-spi2-core \
            dbus-x11 orca speech-dispatcher xdotool x11-xserver-utils openbox \
            python3-gi gir1.2-atspi-2.0
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          orca --version || true
      - name: ATK names, with an accessibility bus
        run: tools/linux_a11y_session.sh .venv/bin/python -m pytest -v tests/test_linux.py
      - name: What Orca says
        run: tools/orca_speech.sh --json orca-speech.json
      - name: Every control Orca reaches has a name
        if: always()
        run: |
          TCP_PROBE_ORCA=1 tools/linux_a11y_session.sh \
            .venv/bin/python tools/ui_probe.py --out probe-linux --tag linux-light
          .venv/bin/python tools/orca_names.py probe-linux
      - name: Keep what Orca said and the probe's pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orca-linux
          path: |
            orca-speech.json
            probe-linux
          if-no-files-found: ignore
