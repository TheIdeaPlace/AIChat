name: The Chat Place tests

# Runs The Chat Place's pytest suite on Windows, macOS and Linux (x64 and
# arm64), the platforms it ships for. Tests of one platform's behaviour (C:\
# paths and MSAA names on Windows, ATK names on Linux) skip on the others
# (tests/markers.py). The UI tests build the window hidden, which works on a
# runner without a desktop; Linux's still needs a display, so it gets Xvfb.
# Linux uses the distribution's wxPython (PyPI has no Linux wheels), as
# linuxsetup.sh does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thechatplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux x64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Pinned to release commits (v4.4.0, v5.6.0).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        if: runner.os != 'Linux'
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        if: runner.os != 'Linux'
        run: python -m pytest -v tests

      # Ubuntu's own Python and wxPython (4.2.1), with the rest from PyPI in a
      # venv that sees them.
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-venv python3-wxgtk4.0 python3-wxgtk-webview4.0 xvfb xauth at-spi2-core
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" .venv/bin/python -m pytest -v tests
